<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>연구 글쓰기 근거 보완 Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <header>
      <h1>선행연구 인용 자동 매칭 &amp; 근거 보완 Agent</h1>
      <p class="subtitle">
        연구 글 초안을 붙여넣으면 문장별 주장에 대응하는 선행연구를 검색하고,
        근거가 부족한 문장을 표시합니다.
      </p>
      <span id="mode-badge" class="badge">모드 확인 중...</span>
    </header>

    <section class="input-section">
      <textarea
        id="draft-input"
        placeholder="여기에 연구 배경 문단이나 초안을 붙여넣으세요..."
      ></textarea>
      <button id="analyze-btn">분석하기</button>
    </section>

    <section id="results"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
